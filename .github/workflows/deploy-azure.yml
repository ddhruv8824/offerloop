# Deploy to Azure App Service: build Offerloop's Docker image, push it to GitHub's container
# registry (ghcr.io), and tell the Azure web app to run it. Step-by-step: deploy/AZURE.md.
#
# Off until set up: it only runs when the repository variable AZURE_WEBAPP_NAME is set
# (Settings → Secrets and variables → Actions → Variables), with the secret
# AZURE_WEBAPP_PUBLISH_PROFILE (the publish profile downloaded from the web app).
name: Deploy to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-azure
  cancel-in-progress: true

jobs:
  deploy:
    if: vars.AZURE_WEBAPP_NAME != ''
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/offerloop
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub's container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run it on Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: ${{ env.IMAGE }}:${{ github.sha }}
