# Render Blueprint: Dashboard → New → Blueprint → pick this repo. See deploy/RENDER.md.
#
# Free plan. Two things make that work:
#  - Data is saved in a free Supabase Postgres database (DATABASE_URL), because a free
#    Render service has no disk that survives a restart.
#  - An outside pinger (cron-job.org) calls /api/automations/tick every 10 minutes, which
#    keeps the service from sleeping and runs scheduled automations on time.
services:
  - type: web
    name: offerloop
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: singapore # closest to India; can't be changed after creation
    healthCheckPath: /offerloop/api/health # BASE_PATH + /api/health
    envVars:
      # Offerloop lives at https://www.ddhruvvv.tech/offerloop; the rest of the domain shows the
      # portfolio (a Render static site), fetched by Offerloop. See deploy/RENDER.md → "Under a path".
      # Clear BASE_PATH and PORTFOLIO_URL (and set healthCheckPath back to /api/health) to serve
      # Offerloop at the root of its own domain instead.
      - key: BASE_PATH
        value: /offerloop
      - key: PORTFOLIO_URL
        value: https://portfolio-lnyt.onrender.com
      - key: PUBLIC_URL # the site's address, without the path
        value: https://www.ddhruvvv.tech
      # Keep Node within the 512 MB instance.
      - key: NODE_OPTIONS
        value: --max-old-space-size=384
      # Accounts (Supabase Auth) — see apps/platform/content/docs/running-offerloop.md.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: ADMIN_EMAILS # your email: no invite needed, gets the Admin page
        sync: false
      - key: SUPPORT_EMAIL
        sync: false
      - key: DATABASE_URL # Supabase → Connect → Session pooler connection string
        sync: false
      # Random, generated by Render.
      - key: INBOX_SECRET # encrypts the Gmail login cookie
        generateValue: true
      - key: CRON_SECRET # the pinger sends it; copy it from the Environment tab
        generateValue: true
      # Optional (leave empty to skip): Gmail → Tracker, and a server AI key for Resume Studio.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false

