# Render Blueprint: Dashboard → New → Blueprint → pick this repo. See deploy/RENDER.md.
#
# Needs a paid instance: the free one sleeps after 15 minutes idle (automations stop) and
# can't have a disk (saved data would be wiped on every deploy).
services:
  - type: web
    name: offerloop
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter # 512 MB RAM, always on
    region: singapore # closest to India; can't be changed after creation
    healthCheckPath: /api/health
    disk:
      name: offerloop-data
      mountPath: /data # workflows + Resume Studio workspaces
      sizeGB: 1
    envVars:
      # Keep Node within the 512 MB instance.
      - key: NODE_OPTIONS
        value: --max-old-space-size=384
      # Asked for when the Blueprint is created.
      - key: APP_PASSWORD
        sync: false
      # Random, generated by Render. Encrypts the Gmail login cookie.
      - key: INBOX_SECRET
        generateValue: true
      # Optional (leave empty to skip): Gmail → Tracker, and server AI keys for Resume Studio.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
