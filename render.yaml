# Render Blueprint: Dashboard → New → Blueprint → pick this repo. See deploy/RENDER.md.
#
# Free plan. Two things make that work:
#  - Data is saved in a free Supabase Postgres database (DATABASE_URL), because a free
#    Render service has no disk that survives a restart.
#  - An outside pinger (cron-job.org) calls /api/automations/tick every 10 minutes, which
#    keeps the service from sleeping and runs scheduled automations on time.
services:
  - type: web
    name: offerloop
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: singapore # closest to India; can't be changed after creation
    healthCheckPath: /api/health
    envVars:
      # Keep Node within the 512 MB instance.
      - key: NODE_OPTIONS
        value: --max-old-space-size=384
      # Asked for when the Blueprint is created.
      - key: APP_PASSWORD
        sync: false
      - key: DATABASE_URL # Supabase → Connect → Session pooler connection string
        sync: false
      # Random, generated by Render.
      - key: INBOX_SECRET # encrypts the Gmail login cookie
        generateValue: true
      - key: CRON_SECRET # the pinger sends it; copy it from the Environment tab
        generateValue: true
      # Optional (leave empty to skip): Gmail → Tracker, and a server AI key for Resume Studio.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # Optional: Signal alerts when a workflow waits for approval (deploy/RENDER.md).
      - key: SIGNAL_PHONE
        sync: false
      - key: SIGNAL_CALLMEBOT_KEY
        sync: false
